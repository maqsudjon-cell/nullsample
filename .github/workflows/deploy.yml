name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: determinism lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: cross-host determinism
        # Node and headless Chrome must produce byte-identical WAVs. This is
        # the check that the whole deterministic-maths layer exists for.
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install lame
        run: sudo apt-get update && sudo apt-get install -y lame

      - name: Rating batch audio
        # Never committed - see .gitignore. Rebuilt from the ranges snapshot
        # inside manifest.json, so it is byte-identical to what was rated, and
        # cached on the batch id so an unrelated push does not re-render it.
        id: batchid
        run: |
          if [ -f web/rate/batch/manifest.json ]; then
            echo "id=$(node -p "require('./web/rate/batch/manifest.json').batchId")" >> "$GITHUB_OUTPUT"
          else
            echo "id=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.batchid.outputs.id != 'none'
        with:
          path: web/rate/batch
          key: ratebatch-${{ steps.batchid.outputs.id }}

      - name: Rebuild any missing batch audio
        if: steps.batchid.outputs.id != 'none'
        run: |
          if [ "$(node -p "require('./web/rate/batch/manifest.json').kind || 'tracks'")" = "drums" ]; then
            npm run drumbatch -- --rebuild
          else
            npm run batch -- --rebuild
          fi

      - name: brand assets
        run: npm run brand
      - name: tracks page
        run: node tools/build-tracks-page.mjs
      - name: build site
        run: npm run build
      - name: CNAME must be in the published output
        run: |
          test -f dist/CNAME || { echo "dist/CNAME missing"; exit 1; }
          grep -qx "nullsample.maqsudjon.com" dist/CNAME || { echo "wrong CNAME"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
